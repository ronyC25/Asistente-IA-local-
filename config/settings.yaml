# Configuracion del asistente.
model: qwen3:8b
temperature: 0.25
num_ctx: 8192            # contexto (prompt base ~6.5k tokens; 8192 entra 100% en GPU de 8 GB)
num_predict: 400         # tope de tokens de salida por respuesta
keep_alive: 30m          # mantiene el modelo en VRAM (evita recargas)
history_limit: 16        # nº maximo de mensajes de historial por sesion
max_tool_iters: 6

# Memoria persistente (SQLite: sessions, messages, memories)
memory:
  enabled: true
  summary_after: 30      # resumir cuando haya mas de N mensajes sin resumir
  history_limit: 16      # mensajes recientes que se cargan al iniciar sesion
  facts_limit: 20        # hechos globales inyectados al inicio
  keep_messages: 500     # retencion aproximada por sesion (el resumen cubre lo antiguo)

# Router de herramientas (reduce el prompt por turno)
tools:
  mode: auto             # auto = solo grupos del dominio; full = las 27 tools
  fallback_full: true    # si el modelo no llama tool, reintentar con todas

assistant_name: Jarvis
language: es
week_start: domingo        # inicio de semana para 'esta semana'/'semana que viene' (domingo | lunes)

database: data/assistant.db

# Servidor web (FastAPI)
host: 127.0.0.1
port: 8000

# Voz (Fase 5)
voice:
  whisper_model: small          # tiny | base | small | medium
  whisper_device: cpu           # cpu | cuda (cuda requiere runtime CUDA 12 + cuDNN)
  whisper_compute: auto         # auto | float16 | int8
  tts_voice: es_MX-claude-high
  wake_model: hey_jarvis
  wake_threshold: 0.5
  input_device:                 # vacio = dispositivo por defecto; o un indice (ver --list-audio)
  silence_ms: 900
  max_record_seconds: 12
  sample_rate: 16000
  voices_dir: data/voices

# Avatar Live2D (Fase 7)
avatar:
  model: Haru                           # avatar por defecto (clave de 'models')
  height: 350                           # alto del avatar en px (la ventana se ajusta)
  models:                               # avatares disponibles (nombre -> model3.json)
    Haru: avatar/public/models/Haru/haru_greeter_t03.model3.json
    Wanko: avatar/public/models/Wanko/Wanko.model3.json
  half_duplex: true

# Bot de Telegram bidireccional (modo --telegram)
telegram:
  poll_timeout: 25              # segundos de long polling de getUpdates

# Scheduler (recordatorios y temporizadores)
scheduler:
  tick_s: 1                     # cada cuantos segundos se revisan los vencimientos

# Pomodoro / temporizadores
pomodoro:
  trabajo_min: 25               # minutos de trabajo por ciclo
  descanso_min: 5               # descanso corto
  descanso_largo_min: 15        # descanso largo cada 'ciclos'
  ciclos: 4                     # descanso largo cada N ciclos de trabajo
  telegram: true                # avisar por Telegram al terminar
  avatar: true                  # que el avatar lo diga (si esta abierto)
  presintetizar: true           # pre-sintetizar la voz del aviso (aviso inmediato)

# Google Calendar (sincronizacion bidireccional via OAuth)
# Requiere autorizar una vez:  .\start.ps1 -Mode auth
google_calendar:
  enabled: true                        # true para activar la sincronizacion
  calendar_id: primary                  # 'primary' o el id de un calendario concreto
  credentials_file: data/google_credentials.json   # OAuth client (App de escritorio)
  token_file: data/google_token.json               # se genera al autorizar
  timezone:                             # vacio = auto-detectar la zona del sistema
  conflict_policy: last_write_wins      # last_write_wins | local_wins | google_wins
