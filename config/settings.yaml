# Configuracion del asistente.
model: qwen3:8b
temperature: 0.25
num_ctx: 4096            # contexto (menor = menos VRAM)
num_predict: 400         # tope de tokens de salida por respuesta
keep_alive: 30m          # mantiene el modelo en VRAM (evita recargas)
history_limit: 16        # nº maximo de mensajes de historial por sesion
max_tool_iters: 6

assistant_name: Jarvis
language: es

database: data/assistant.db

# Servidor web (FastAPI)
host: 127.0.0.1
port: 8000

# Voz (Fase 5)
voice:
  whisper_model: small          # tiny | base | small | medium
  whisper_device: cpu           # cpu | cuda (cuda requiere runtime CUDA 12 + cuDNN)
  whisper_compute: auto         # auto | float16 | int8
  tts_voice: es_MX-claude-high
  wake_model: hey_jarvis
  wake_threshold: 0.5
  input_device:                 # vacio = dispositivo por defecto; o un indice (ver --list-audio)
  silence_ms: 900
  max_record_seconds: 12
  sample_rate: 16000
  voices_dir: data/voices

# Avatar Live2D (Fase 7)
avatar:
  model: Haru
  model_path: avatar/public/models/Haru/haru_greeter_t03.model3.json
  half_duplex: true

# Bot de Telegram bidireccional (modo --telegram)
telegram:
  poll_timeout: 25              # segundos de long polling de getUpdates
