<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis - Reloj / Temporizador</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      background: radial-gradient(900px 480px at 50% -10%, #1a2550 0%, #0b1020 60%);
      color: #eaf1ff; font-family: "Segoe UI", system-ui, sans-serif;
      display: flex; justify-content: center; padding: 16px;
    }
    #timer { width: 100%; max-width: 440px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header .logo {
      width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center;
      justify-content: center; font-size: 16px;
      background: linear-gradient(135deg, #4f9cf9, #35d0ba);
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .3px; }
    header .sub { margin-left: auto; font-size: 11px; color: #8b97b3; }
  </style>
</head>
<body>
  <div id="timer">
    <header>
      <span class="logo">🕐</span>
      <h1>Reloj / Temporizador</h1>
      <span class="sub">Jarvis</span>
    </header>
    <div id="widget"></div>
  </div>
  <script src="/avatar/timer.js"></script>
  <script>JarvisTimer.mount("widget");</script>
</body>
</html>
